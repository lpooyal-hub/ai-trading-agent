services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/trading_agent.db
    ports:
      - "${BACKEND_PORT:-81}:8000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:81}
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      - backend

volumes:
  backend_data:
